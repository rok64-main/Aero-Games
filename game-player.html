<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>AeroGames Player</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        #game-frame {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: #000;
        }

        #message {
            min-height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="message">Game could not be loaded.</div>
    <iframe
        id="game-frame"
        title="HTML Game"
        allowfullscreen
        allow="autoplay; fullscreen; microphone; camera; geolocation; gyroscope; accelerometer; magnetometer; xr-spatial-tracking; gamepad; unload"
        sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-pointer-lock allow-modals allow-downloads allow-presentation">
    </iframe>

    <script>
        var frame = document.getElementById('game-frame');
        var message = document.getElementById('message');

        function getRequestedGameUrl() {
            var params = new URLSearchParams(window.location.search);
            var rawUrl = params.get('game') || '';

            try {
                var gameUrl = new URL(rawUrl, window.location.href);
                var rootUrl = new URL('./games/', window.location.href);

                if (gameUrl.origin !== window.location.origin) return null;
                if (gameUrl.href.indexOf(rootUrl.href) !== 0) return null;
                if (!gameUrl.pathname.toLowerCase().endsWith('.html')) return null;

                return gameUrl.href;
            } catch (e) {
                return null;
            }
        }

        function showMessage() {
            frame.style.display = 'none';
            message.style.display = 'flex';
        }

        var allowedGameUrl = getRequestedGameUrl();
        if (allowedGameUrl) {
            frame.dataset.allowedUrl = allowedGameUrl;
            frame.src = allowedGameUrl;
        } else {
            showMessage();
        }

        frame.addEventListener('load', function() {
            var currentUrl = frame.currentSrc || frame.src;
            try {
                if (frame.contentWindow && frame.contentWindow.location) {
                    currentUrl = frame.contentWindow.location.href;
                }
            } catch (e) {}

            try {
                var current = new URL(currentUrl, window.location.href);
                var allowed = new URL(allowedGameUrl, window.location.href);
                if (current.origin === allowed.origin &&
                    current.pathname === allowed.pathname &&
                    current.search === allowed.search) {
                    return;
                }
            } catch (e) {}

            frame.src = allowedGameUrl;
        });
    </script>
</body>
</html>
