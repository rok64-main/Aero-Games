<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Typing Course</title>

<style>
:root{
  --bg:#0b1220;
  --card:#111b2e;
  --card2:#0f172a;
  --text:#e5e7eb;
  --muted:#94a3b8;
  --green:#22c55e;
  --red:#ef4444;
  --yellow:#facc15;
  --blue:#3b82f6;
}

body{
  margin:0;
  font-family:system-ui, Arial;
  background:var(--bg);
  color:var(--text);
}

.center{
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
}

.card{
  width:760px;
  background:var(--card);
  border-radius:16px;
  padding:20px;
  box-shadow:0 20px 60px rgba(0,0,0,0.4);
}

.hidden{display:none;}

h1,h2,h3{margin:0 0 10px 0;}

.small{color:var(--muted); font-size:13px;}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.btn{
  padding:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  color:white;
  font-weight:600;
}

.primary{background:var(--blue);}
.locked{background:#334155; opacity:0.5;}
.level{background:#1f2a44;}

.level:hover{filter:brightness(1.1);}

.tag{
  display:inline-block;
  padding:3px 8px;
  border-radius:999px;
  font-size:12px;
  background:#1f2a44;
  color:var(--muted);
  margin-bottom:10px;
}

#text{
  margin-top:12px;
  padding:16px;
  background:var(--card2);
  border-radius:12px;
  font-size:26px;
  line-height:1.9;
  min-height:90px;
  user-select:none;
}

.correct{color:var(--green);}
.wrong{color:var(--red); background:rgba(239,68,68,0.15); border-radius:4px;}
.fixed{color:var(--yellow); background:rgba(250,204,21,0.15); border-radius:4px;}
.current{text-decoration:underline;}

.space{
  display:inline-block;
  width:14px;
  height:18px;
  border-bottom:2px solid #334155;
  margin:0 2px;
}

.space.correct{background:rgba(34,197,94,0.2);}
.space.wrong{background:rgba(239,68,68,0.2);}
.space.fixed{background:rgba(250,204,21,0.2);}

input{
  position:absolute;
  opacity:0;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

#stats{
  color:var(--muted);
  font-size:13px;
}

.back{
  margin-top:10px;
  background:#1f2a44;
  color:white;
}

.finishBox{
  text-align:center;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="center">
  <div class="card">
    <h2>Typing Trainer</h2>
    <div class="small">Choose a category</div>
    <br/>

    <div class="grid" id="categories"></div>
  </div>
</div>

<!-- LEVELS -->
<div id="levelsScreen" class="center hidden">
  <div class="card">
    <div class="topbar">
      <h3 id="catTitle"></h3>
      <button class="btn primary" onclick="showHome()">Home</button>
    </div>
    <div class="grid" id="levels"></div>
  </div>
</div>

<!-- GAME -->
<div id="game" class="center hidden">
  <div class="card">
    <div class="topbar">
      <div>
        <h3 id="levelTitle"></h3>
        <div id="stats">WPM: 0</div>
      </div>
      <button class="btn primary" onclick="backToLevels()">Back</button>
    </div>

    <div id="text"></div>
    <input id="input" autocomplete="off"/>
  </div>
</div>

<!-- FINISH -->
<div id="finish" class="center hidden">
  <div class="card finishBox">
    <h2>Completed</h2>
    <div id="result"></div>
    <button class="btn primary" onclick="nextLevel()">Next</button>
  </div>
</div>

<script>
/* ---------------- DATA ---------------- */

const data = {
  "Home Row": [
    "a a s s d d f f j j k k l l",
    "asdf jkl; asdf jkl;",
    "asdf jkl; practice flow",
    "home row accuracy test"
  ],
  "Top Row": [
    "q w e r t y u i o p",
    "quick type practice row",
    "top row accuracy drill",
    "qwerty practice session"
  ],
  "Bottom Row": [
    "z x c v b n m",
    "bottom row practice drill",
    "zxcvbnm speed test",
    "lower row typing flow"
  ],
  "Words": [
    "the quick brown fox",
    "jump over lazy dog",
    "typing improves daily",
    "focus speed accuracy",
    "learn build improve repeat"
  ],
  "Sentences": [
    "the quick brown fox jumps over the lazy dog",
    "typing is a skill that improves with practice",
    "accuracy matters more than speed at the start",
    "practice every day to improve muscle memory"
  ]
};

let progress = JSON.parse(localStorage.getItem("typingProgressV2") || "{}");

let currentCat = null;
let levelIndex = 0;
let startTime = 0;
let wrongMap = [];

/* ---------------- HOME ---------------- */

function renderCategories(){
  const el = document.getElementById("categories");
  el.innerHTML = "";

  Object.keys(data).forEach(cat=>{
    const btn = document.createElement("button");
    btn.className="btn level";
    btn.innerText = cat;
    btn.onclick = ()=>openCategory(cat);
    el.appendChild(btn);
  });
}

function openCategory(cat){
  currentCat = cat;
  document.getElementById("home").classList.add("hidden");
  document.getElementById("levelsScreen").classList.remove("hidden");

  document.getElementById("catTitle").innerText = cat;

  const levels = document.getElementById("levels");
  levels.innerHTML = "";

  data[cat].forEach((_,i)=>{
    const btn = document.createElement("button");
    btn.className="btn primary";

    const unlocked = (progress[cat] || 0) >= i;

    btn.innerText = "Level " + (i+1);

    if(!unlocked){
      btn.className="btn locked";
      btn.disabled=true;
    } else {
      btn.onclick=()=>startLevel(i);
    }

    levels.appendChild(btn);
  });
}

function showHome(){
  document.getElementById("levelsScreen").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");
}

/* ---------------- GAME ---------------- */

function startLevel(i){
  levelIndex = i;
  startTime = Date.now();
  wrongMap = [];

  document.getElementById("levelsScreen").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  document.getElementById("finish").classList.add("hidden");

  document.getElementById("levelTitle").innerText =
    currentCat + " - Level " + (i+1);

  const input = document.getElementById("input");
  input.value="";
  input.focus();

  renderText("");
}

function renderText(input){
  const target = data[currentCat][levelIndex];

  let html="";

  for(let i=0;i<target.length;i++){
    const t=target[i];
    const c=input[i];

    let state="";

    if(c!==undefined){
      if(c===t){
        state="correct";
        wrongMap[i]=false;
      } else {
        if(wrongMap[i]===undefined) wrongMap[i]=true;
        state=wrongMap[i] ? "wrong" : "fixed";
      }
    } else if(i===input.length){
      state="current";
    }

    if(t===" "){
      html+=`<span class="space ${state}"></span>`;
    } else {
      html+=`<span class="${state}">${t}</span>`;
    }
  }

  document.getElementById("text").innerHTML=html;

  const wpm = Math.round(((input.length/5)/((Date.now()-startTime)/60000))||0);
  document.getElementById("stats").innerText="WPM: "+wpm;
}

/* FINISH EVEN IF WRONG */
document.getElementById("input").addEventListener("input",(e)=>{
  const val=e.target.value;
  renderText(val);

  const target=data[currentCat][levelIndex];

  if(val.length>=target.length){
    finish();
  }
});

function finish(){
  const time=(Date.now()-startTime)/1000;

  const target=data[currentCat][levelIndex];
  const input=document.getElementById("input").value;

  const wpm=Math.round((input.length/5)/(time/60));

  document.getElementById("game").classList.add("hidden");
  document.getElementById("finish").classList.remove("hidden");

  document.getElementById("result").innerHTML=`
    WPM: <b>${wpm}</b><br>
    Time: <b>${time.toFixed(1)}s</b>
  `;

  if(!progress[currentCat]) progress[currentCat]=0;
  if(levelIndex>=progress[currentCat]){
    progress[currentCat]=levelIndex+1;
    localStorage.setItem("typingProgressV2", JSON.stringify(progress));
  }
}

function nextLevel(){
  const next = levelIndex+1;

  if(next < data[currentCat].length){
    startLevel(next);
  } else {
    backToLevels();
  }
}

function backToLevels(){
  document.getElementById("game").classList.add("hidden");
  document.getElementById("finish").classList.add("hidden");
  document.getElementById("levelsScreen").classList.remove("hidden");
}

/* INIT */
renderCategories();
</script>

</body>
</html>
